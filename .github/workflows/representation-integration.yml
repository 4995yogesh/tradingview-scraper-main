name: Representation integration

on:
  push:
    branches:
      - agent/representation-learning-integration
  pull_request:
    branches:
      - ml-try-2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tradingview-scraper-main/Trading-Project/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install research export dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Run research export tests
        run: python -m pytest tests/test_research_export.py -q
      - name: Compile research export entrypoint
        run: python -m py_compile research_export.py
